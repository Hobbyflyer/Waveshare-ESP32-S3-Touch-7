# Aktiviert den Logger, damit wir sehen, was passiert
logger:
  baud_rate: 115200

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  #fast_connect: true

# Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    password: !secret fallback_password

captive_portal:

# Enable Home Assistant API
api:
#  encryption:
#   key: !secret api_key

# Sobald HA die Verbindung verliert, wird das Label inaktiv (grau)
  on_client_disconnected:
    if:
      condition:
        not:
          api.connected:
      then:
        - esp32_ble_tracker.stop_scan:
        - lvgl.label.update:
            id: wifi_signal_label
            text_color: 0x555555  # Grau/inaktiv
        
  # Sobald die Verbindung wieder steht, wird das Label aktiv
  on_client_connected:
    then:
      - lvgl.label.update:
          id: wifi_signal_label
          text_color: 0xAAAAAA  # Normal/aktiv
      - esp32_ble_tracker.start_scan:
         continuous: true
ota:
  platform: esphome

sensor:
  # WiFi Signal Strength (RSSI)
  - platform: wifi_signal
    name: "WiFi Signal Sensor"
    id: wifi_rssi
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 20s
    on_value:
      then:
        - lvgl.label.update:
            id: wifi_signal_label
            text: !lambda |-
              char buffer[20];
              sprintf(buffer, "WiFi: %d dBm", (int)x);
              return std::string(buffer);
  
  - platform: uptime
    # The uptime sensor is extremely helpful to know if your device is rebooting
    # when it shouldn't be. This might indicate your interval-to-window timing is
    # too tight, and the window needs to be reduced.
    name: "Uptime Sensor"
    entity_category: diagnostic
    update_interval: 60s  

text_sensor:
  - platform: wifi_info
    ip_address:
      id: ip_addr

esp32_ble_tracker:
  scan_parameters:
    # Don't auto start BLE scanning, we control it in the `api` block's automation.
    continuous: False
    
    active: True  # send scan-request packets to gather more info, like device name for some devices.

    interval: 320ms  # default 320ms - how long to spend on each advert channel
    window:   50ms  # default 30ms - how long to actually "listen" in each interval. Reduce this if device is unstable.
    # If the device cannot keep up or becomes unstable, reduce the "window" setting. This may be
    # required if your device is controlling other sensors or doing PWM for lights etc.

bluetooth_proxy:
  active: true  # allows outbound connections from HA to devices.
