script:
  - id: sync_light_buttons
    then:
      - lambda: |-
          ESP_LOGD("ha_sync", "Periodic sync of light button states");
          if (id(light_ambiente_state).has_state() && id(main_page_ambiente_toggle) != nullptr) {
            if (id(light_ambiente_state).state) { lv_obj_add_state(id(main_page_ambiente_toggle), LV_STATE_CHECKED); }
            else { lv_obj_clear_state(id(main_page_ambiente_toggle), LV_STATE_CHECKED); }
          }
          if (id(light_wand_links_state).has_state() && id(light_page_wand_links_toggle) != nullptr) {
            if (id(light_wand_links_state).state) { lv_obj_add_state(id(light_page_wand_links_toggle), LV_STATE_CHECKED); }
            else { lv_obj_clear_state(id(light_page_wand_links_toggle), LV_STATE_CHECKED); }
          }
          if (id(light_wand_mitte_state).has_state() && id(light_page_wand_mitte_toggle) != nullptr) {
            if (id(light_wand_mitte_state).state) { lv_obj_add_state(id(light_page_wand_mitte_toggle), LV_STATE_CHECKED); }
            else { lv_obj_clear_state(id(light_page_wand_mitte_toggle), LV_STATE_CHECKED); }
          }
          if (id(light_wand_rechts_state).has_state() && id(light_page_wand_rechts_toggle) != nullptr) {
            if (id(light_wand_rechts_state).state) { lv_obj_add_state(id(light_page_wand_rechts_toggle), LV_STATE_CHECKED); }
            else { lv_obj_clear_state(id(light_page_wand_rechts_toggle), LV_STATE_CHECKED); }
          }
          if (id(light_tuercouch_state).has_state() && id(light_page_tuercouch_toggle) != nullptr) {
            if (id(light_tuercouch_state).state) { lv_obj_add_state(id(light_page_tuercouch_toggle), LV_STATE_CHECKED); }
