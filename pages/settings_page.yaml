id: settings_page
scrollable: false
on_gesture:
  - if:
      condition:
        lambda: |-
          lv_indev_t *indev = lv_indev_get_act();
          if (indev == nullptr || lv_indev_get_gesture_dir(indev) != LV_DIR_LEFT) return false;
          // Slider-Bereiche von der Swipe-Navigation ausnehmen
          lv_point_t point;
          lv_indev_get_point(indev, &point);
          if (point.y >= 72 && point.y <= 106 && point.x >= 320 && point.x <= 760) return false;
          if (point.y >= 144 && point.y <= 178 && point.x >= 320 && point.x <= 760) return false;
          return true;
      then:
        - script.execute:
            id: change_page
            direction: 1
        - lvgl.page.next:
  - if:
      condition:
        lambda: |-
          lv_indev_t *indev = lv_indev_get_act();
          if (indev == nullptr || lv_indev_get_gesture_dir(indev) != LV_DIR_RIGHT) return false;
          // Slider-Bereiche von der Swipe-Navigation ausnehmen
          lv_point_t point;
          lv_indev_get_point(indev, &point);
          if (point.y >= 72 && point.y <= 106 && point.x >= 320 && point.x <= 760) return false;
          if (point.y >= 144 && point.y <= 178 && point.x >= 320 && point.x <= 760) return false;
          return true;
      then:
        - script.execute:
            id: change_page
            direction: -1
        - lvgl.page.previous:
