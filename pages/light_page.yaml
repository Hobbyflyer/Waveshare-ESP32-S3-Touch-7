# Lichtsteuerungsseite
# Verantwortung: Lichter-Gruppen mit Toggle-Buttons und Helligkeit-Schiebereglern
# Swipe-Navigation: Links = nächste Seite, Rechts = vorherige Seite

id: light_page
scrollable: false
on_gesture:
  then:
    # Swipe nach links → nächste Seite
    - if:
        condition:
          lambda: |-
            lv_indev_t *indev = lv_indev_get_act();
            if (indev == nullptr || lv_indev_get_gesture_dir(indev) != LV_DIR_LEFT) return false;
            // Prüfe ob Touch im Slider-Bereich ist (Y: 85-120, X: 300-750)
            lv_point_t point;
            lv_indev_get_point(indev, &point);
            if (point.y >= 85 && point.y <= 120 && point.x >= 300 && point.x <= 750) return false;
            return true;
        then:
          - lambda: |-
              id(current_page_index) = (id(current_page_index) + 1) % 3;
              if (id(current_page_index) == 0) {
                lv_label_set_text(id(page_name_label), "Main");
              } else if (id(current_page_index) == 1) {
                lv_label_set_text(id(page_name_label), "Light");
              } else {
                lv_label_set_text(id(page_name_label), "Settings");
              }
          - lvgl.page.next:
    
    # Swipe nach rechts → vorherige Seite
    - if:
        condition:
          lambda: |-
            lv_indev_t *indev = lv_indev_get_act();
            if (indev == nullptr || lv_indev_get_gesture_dir(indev) != LV_DIR_RIGHT) return false;
            // Prüfe ob Touch im Slider-Bereich ist (Y: 85-120, X: 300-750)
            lv_point_t point;
            lv_indev_get_point(indev, &point);
            if (point.y >= 85 && point.y <= 120 && point.x >= 300 && point.x <= 750) return false;
            return true;
        then:
          - lambda: |-
              id(current_page_index) = (id(current_page_index) - 1 + 3) % 3;
              if (id(current_page_index) == 0) {
                lv_label_set_text(id(page_name_label), "Main");
              } else if (id(current_page_index) == 1) {
                lv_label_set_text(id(page_name_label), "Light");
              } else {
                lv_label_set_text(id(page_name_label), "Settings");
              }
          - lvgl.page.previous:

widgets:
  # Hintergrundbild
  - image:
      align: CENTER
      src: main_background
      width: 800
      height: 480
  
  # ═══════════════════════════════════════════════════════════════
  # FROSTED GLASS DESIGN - Light Control
  # ═══════════════════════════════════════════════════════════════
  
  # Light Control Card 1: TV-Licht
  - obj:
      id: light_page_tv_panel
      x: 30
      y: 80
      width: 740
      height: 80
      bg_color: 0x2a3f5f
      bg_opa: 80%
      border_width: 1
      border_color: 0x5599dd
      border_side: INTERNAL
      radius: 10
  
  - label:
      id: light_page_tv_label
      x: 50
      y: 95
      text: "TV-Licht"
      text_font: roboto_european_core
      text_color: 0xf0f0f0
  
  - switch:
      id: light_page_tv_toggle
      x: 240
      y: 90
      width: 60
      height: 35
      bg_color: 0x1a2f4f
      bg_opa: 80%
      border_width: 1
      border_color: 0x5599dd
      border_side: INTERNAL
      checked:
        bg_color: 0x1ba1d1
        bg_opa: 90%
      on_value:
        then:
          - homeassistant.service:
              service: !lambda 'return x ? "light.turn_on" : "light.turn_off";'
              data:
                entity_id: light.licht_tv
  
  - slider:
      id: light_page_tv_brightness
      x: 320
      y: 92
      width: 420
      height: 20
      min_value: 0
      max_value: 255
      bg_color: 0x1a2f4f
      bg_opa: 60%
      border_width: 1
      border_color: 0x5599dd
      border_side: INTERNAL
      indicator:
        bg_color: 0x1ba1d1
        bg_opa: 90%
      on_value:
        then:
          - homeassistant.service:
              service: light.turn_on
              data:
                entity_id: light.licht_tv
                brightness: !lambda 'return int(x);'
      knob:
        bg_color: 0xFFFFFF
      on_release:
        then:
          - homeassistant.service:
              service: light.turn_on
              data:
                entity_id: light.licht_tv
                brightness: !lambda 'return (int)x;'
  
  # TODO: Wohnbereich-Lichter (4 Spots)
