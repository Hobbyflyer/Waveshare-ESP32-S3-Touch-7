id: rolladen_page
scrollable: false
on_gesture:
  - if:
      condition:
        lambda: |-
          lv_indev_t *indev = lv_indev_get_act();
          if (indev == nullptr || lv_indev_get_gesture_dir(indev) != LV_DIR_LEFT) return false;
          return true;
      then:
        - script.execute:
            id: change_page
            direction: 1
        - lvgl.page.next:
  - if:
      condition:
        lambda: |-
          lv_indev_t *indev = lv_indev_get_act();
          if (indev == nullptr || lv_indev_get_gesture_dir(indev) != LV_DIR_RIGHT) return false;
          return true;
      then:
        - script.execute:
            id: change_page
            direction: -1
        - lvgl.page.previous:
