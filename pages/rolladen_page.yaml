# AUTO-GENERATED by tools/generate_ui.py - NICHT manuell editieren!
# Quelle: layout.json | Aenderungen dort vornehmen und Generator erneut laufen lassen.

id: rolladen_page
scrollable: false
on_gesture:
  - if:
      condition:
        lambda: |-
          lv_indev_t *indev = lv_indev_get_act();
          if (indev == nullptr || lv_indev_get_gesture_dir(indev) != LV_DIR_LEFT) return false;
          return true;
      then:
        - script.execute:
            id: change_page
            direction: 1
        - lvgl.page.next:
  - if:
      condition:
        lambda: |-
          lv_indev_t *indev = lv_indev_get_act();
          if (indev == nullptr || lv_indev_get_gesture_dir(indev) != LV_DIR_RIGHT) return false;
          return true;
      then:
        - script.execute:
            id: change_page
            direction: -1
        - lvgl.page.previous:
widgets:
  # Dunkler Navy-Verlauf als durchgehender Hintergrund (Referenz: Control System)
  - obj:
      x: 0
      y: 0
      width: 800
      height: 480
      scrollable: false
      bg_color: 0x07111f
      bg_grad_color: 0x101f33
      bg_grad_dir: VER
      bg_opa: 100%
      border_width: 0
      radius: 0
  # West (cover.rollladen_wz_rechts) - Rolladen: Auf/Stop/Zu + Positionsanzeige
  - obj:
      id: rolladen_page_west_panel
      x: 30
      y: 70
      width: 366
      height: 64
      scrollable: false
      bg_color: 0x101f33
      bg_opa: 80%
      border_width: 1
      border_color: 0x213955
      border_side: INTERNAL
      radius: 12
  - label:
      id: rolladen_page_west_label
      x: 42
      y: 76
      text: "West"
      text_font: roboto_european_core_18
      text_color: 0xf4f8fc
  - label:
      id: rolladen_page_west_position_value
      x: 314
      y: 76
      width: 70
      height: 24
      text: "-- %"
      text_align: RIGHT
      text_font: roboto_european_core_18
      text_color: 0x20b8e6
  - button:
