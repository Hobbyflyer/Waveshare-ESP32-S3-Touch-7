# AUTO-GENERATED by tools/generate_ui.py - NICHT manuell editieren!
# Quelle: layout.json | Aenderungen dort vornehmen und Generator erneut laufen lassen.

id: main_page
scrollable: false
on_gesture:
  - if:
      condition:
        lambda: |-
          lv_indev_t *indev = lv_indev_get_act();
          if (indev == nullptr || lv_indev_get_gesture_dir(indev) != LV_DIR_LEFT) return false;
          return true;
      then:
        - script.execute:
            id: change_page
            direction: 1
        - lvgl.page.next:
  - if:
      condition:
        lambda: |-
          lv_indev_t *indev = lv_indev_get_act();
          if (indev == nullptr || lv_indev_get_gesture_dir(indev) != LV_DIR_RIGHT) return false;
          return true;
      then:
        - script.execute:
            id: change_page
            direction: -1
        - lvgl.page.previous:
widgets:
  # Dunkler Navy-Verlauf als durchgehender Hintergrund (Referenz: Control System)
  - obj:
      x: 0
      y: 0
      width: 800
      height: 480
      scrollable: false
      bg_color: 0x07111f
      bg_grad_color: 0x101f33
      bg_grad_dir: VER
      bg_opa: 100%
      border_width: 0
      radius: 0
  # Thermostat: Kreis-Slider (Arc) fuer Soll-Temperatur, Ist-Temperatur in der Mitte
  - arc:
      id: main_page_thermostat_arc
      x: 53
      y: 86
      width: 320
      height: 320
      min_value: 15
      max_value: 25
      value: 21
      start_angle: 135
      end_angle: 45
      arc_width: 14
      bg_opa: 0%
      indicator:
        arc_width: 14
        bg_color: 0x20b8e6
        bg_opa: 90%
      knob:
        bg_color: 0xFFFFFF
      on_value:
        then:
          - lambda: |-
              lv_label_set_text_fmt(id(main_page_thermostat_target_value), "Soll: %.0f °C", x);
      on_release:
        then:
          - homeassistant.service:
              service: climate.set_temperature
              data:
                entity_id: climate.thermostat
                temperature: !lambda 'return x;'
  - label:
