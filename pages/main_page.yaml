# Quelle: layout.json | Aenderungen dort vornehmen und Generator erneut laufen lassen.

id: main_page
scrollable: false
on_gesture:
  - if:
      condition:
        lambda: |-
          lv_indev_t *indev = lv_indev_get_act();
          if (indev == nullptr || lv_indev_get_gesture_dir(indev) != LV_DIR_LEFT) return false;
          // Slider-Bereiche von der Swipe-Navigation ausnehmen
          lv_point_t point;
          lv_indev_get_point(indev, &point);
          if (point.y >= 194 && point.y <= 230 && point.x >= 110 && point.x <= 690) return false;
          if (point.y >= 270 && point.y <= 306 && point.x >= 110 && point.x <= 690) return false;
          return true;
      then:
        - script.execute:
            id: change_page
            direction: 1
        - lvgl.page.next:
  - if:
      condition:
        lambda: |-
          lv_indev_t *indev = lv_indev_get_act();
          if (indev == nullptr || lv_indev_get_gesture_dir(indev) != LV_DIR_RIGHT) return false;
          // Slider-Bereiche von der Swipe-Navigation ausnehmen
          lv_point_t point;
          lv_indev_get_point(indev, &point);
          if (point.y >= 194 && point.y <= 230 && point.x >= 110 && point.x <= 690) return false;
          if (point.y >= 270 && point.y <= 306 && point.x >= 110 && point.x <= 690) return false;
          return true;
      then:
        - script.execute:
            id: change_page
            direction: -1
        - lvgl.page.previous:
