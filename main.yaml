## Main Configuration für Waveshare ESP32-S3 Touch LCD 7
## Diese Datei orchestriert alle Komponenten des Projekts

packages:
  wifi: !include common/wifi.yaml
  ble: !include common/ble.yaml
  diagnostics: !include common/diagnostics.yaml
  hardware: !include waveshare/waveshare-esp32-s3-touch-lcd-7-bl.yaml
  entities: !include entities/entities.yaml
  resources: !include ui/resources.yaml
  ui: !include ui/lvgl.yaml

# ============================================================================
# API (Sync with Home Assistant)
# ============================================================================

api:
  id: homeassistant_api
  reboot_timeout: 0s  # Kein automatischer Reboot bei API-Verbindungsverlust
  # encryption:
  #   key: !secret api_key

  # Sobald HA die Verbindung verliert, wird das WiFi-Label inaktiv (grau)
  on_client_disconnected:
    if:
      condition:
        not:
          api.connected:
      then:
        - esp32_ble_tracker.stop_scan:
        - lvgl.label.update:
            id: wifi_signal_label
            text_color: 0x555555  # Grau/inaktiv
        - lvgl.label.update:
            id: wifi_signal_label
            text: "\xF3\xB0\xA4\xAE"  # wifi-strength-off-outline

  on_client_connected:
    # UI-State (Brightness/Timeout Slider) nach (Re-)Connect synchronisieren
    - script.execute: sync_ui_state
    - script.execute: sync_light_buttons
    # WiFi-Label wieder aktiv schalten
    - lvgl.label.update:
        id: wifi_signal_label
        text_color: 0xAAAAAA  # Normal/aktiv
    # BLE-Scan (Bluetooth Proxy) starten
    - esp32_ble_tracker.start_scan:
        continuous: true

ota:
  platform: esphome

esphome:
  name: "waveshare-test"
  friendly_name: "Display_1"
  on_boot:
    # Setze Priorität so, dass LVGL schon initialisiert ist, aber bevor die Hauptschleife startet
    priority: -100
    then:
      # Initiale Synchronisation der Slider mit den restored States
      - script.execute: sync_ui_state
      - script.execute: sync_light_buttons
