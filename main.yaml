## Main Configuration für Waveshare ESP32-S3 Touch LCD 7
## Diese Datei orchestriert alle Komponenten des Projekts

packages:
  wifi: !include common/wifi.yaml
  hardware: !include waveshare/waveshare-esp32-s3-touch-lcd-7-bl.yaml
  entities: !include entities/entities.yaml

# ============================================================================
# BOOT ACTIONS
# ============================================================================

# ============================================================================
# API ACTIONS (Sync with Home Assistant)
# ============================================================================

api:
  id: homeassistant_api
  reboot_timeout: 0s  # Kein automatischer Reboot bei API-Verbindungsverlust
  on_client_connected:
    - lambda: |-
        // 1. Timeout Value synchronisieren (von Flash oder HA Number)
        if (id(display_timeout).state > 0) {
            ESP_LOGD("sync", "Syncing Timeout Slider from Number: %f", id(display_timeout).state);
            if (id(settings_page_timeout_slider) != nullptr) {
              lv_slider_set_value(id(settings_page_timeout_slider), (int)id(display_timeout).state, LV_ANIM_OFF);
            }
            if (id(settings_page_timeout_value) != nullptr) {
              lv_label_set_text_fmt(id(settings_page_timeout_value), "%d s", (int)id(display_timeout).state);
            }
        }

        // 2. Brightness Slider synchronisieren - Wir lesen den aktuellen State des Lights
        // Da das Light restored wurde, sollte 'current_values' den korrekten Wert haben.
        float current_brightness = id(lcdbacklight_brightness).remote_values.get_brightness();
        ESP_LOGD("sync", "Syncing Brightness Slider from Light: %f", current_brightness);
        
        int slider_value = (int)(current_brightness * 255.0);
        
        // Ensure slider is within bounds (10-255) to match initialization
        if (slider_value < 10) slider_value = 10;
        if (slider_value > 255) slider_value = 255;

        if (id(settings_page_brightness_slider) != nullptr) {
           lv_slider_set_value(id(settings_page_brightness_slider), slider_value, LV_ANIM_OFF);
        }

esphome:
  name: "waveshare-test"
  friendly_name: "Display_1"
  on_boot:
    # Setze Priorität so, dass LVGL schon initialisiert ist, aber bevor die Hauptschleife startet
    priority: -100
    then:
      - lambda: |-
          // 1. Brightness Slider synchronisieren
          // Die initial_brightness wurde bereits durch initial_state in der Hardware-Datei gesetzt
          if (id(settings_page_brightness_slider) != nullptr) {
             float current_brightness = id(lcdbacklight_brightness).current_values.get_brightness();
             int slider_value = (int)(current_brightness * 255.0);
             
             // Update global variable for restore logic
             id(original_brightness) = current_brightness;
             
             lv_slider_set_value(id(settings_page_brightness_slider), slider_value, LV_ANIM_OFF);
          }
          
          // 2. Timeout Slider synchronisieren (Initial)
          if (id(display_timeout).state > 0) {
              if (id(settings_page_timeout_slider) != nullptr) {
                lv_slider_set_value(id(settings_page_timeout_slider), (int)id(display_timeout).state, LV_ANIM_OFF);
              }
              if (id(settings_page_timeout_value) != nullptr) {
                lv_label_set_text_fmt(id(settings_page_timeout_value), "%d s", (int)id(display_timeout).state);
              }
          }

# ============================================================================
# RESOURCES: Time, Fonts, Images
# ============================================================================

time:
  - platform: homeassistant
    id: homeassistant_time


# Font resources
# default montserrat_
font:
  - file:
      type: gfonts
      family: Roboto
    id: roboto_european_core
    size: 24
  
  # Größere Schrift für Uhrzeit-Anzeige (2 cm ≈ 75-80px Höhe)
  - file:
      type: gfonts
      family: Roboto
    id: roboto_european_core_96
    size: 96

image:
  - file: images/main_bg.png
    id: main_background
    type: RGB565
    resize: 800x480

interval:
  - interval: 1s
    then:
      # Uhrzeit auf Main Page aktualisieren
      - lvgl.label.update:
          id: main_page_time_display
          text: !lambda |-
            static char time_str[6];
            auto time = id(homeassistant_time).now();
            snprintf(time_str, sizeof(time_str), "%02d:%02d", time.hour, time.minute);
            return time_str;

# ============================================================================
# LVGL: Display-Framework mit Header, Footer und Pages
# ============================================================================
lvgl:

  # Display Idle Timeout
  on_idle:
    timeout: !lambda "return id(display_timeout).state * 1000;"
    then:
      - lambda: |-
          // Nur wenn Display aktiv ist
          if (id(display_active)) {
            id(display_active) = false;
            id(original_brightness) = id(lcdbacklight_brightness).current_values.get_brightness();
            
            float dim_level = id(display_dim_level).state / 100.0;
            if (dim_level == 0) {
              // Ausschalten
              auto call = id(lcdbacklight_brightness).turn_off();
              call.perform();
            } else {
              // Dimmen
              auto call = id(lcdbacklight_brightness).turn_on();
              call.set_brightness(dim_level);
              call.perform();
            }
          }

  # Persistente Elemente: Header und Footer auf allen Seiten sichtbar
  top_layer:
    widgets:
      # Header - durchgehende Leiste
      # Globaler Header - WiFi & Uhrzeit (Frosted Glass)
      - obj:
          x: 10
          y: 10
          width: 780
          height: 40
          scrollable: false
          bg_color: 0x2a3f5f
          bg_opa: 80%
          border_width: 1
          border_color: 0x5599dd
          border_side: INTERNAL
          radius: 10
          widgets:
            - label:
                id: wifi_signal_label
                align: LEFT_MID
                x: 15
                text_color: 0xf0f0f0
                text: "WiFi: --"
                  
      
      # Footer Navigation - Vorheriger Screen (links)
      - button:
          id: nav_prev_button
          x: 10
          y: 430
          width: 80
          height: 40
          scrollable: false
          bg_color: 0x2a3f5f
          bg_opa: 80%
          border_width: 1
          border_color: 0x5599dd
          border_side: INTERNAL
          radius: 20
          widgets:
            - label:
                align: CENTER
                text: "<"
                text_font: roboto_european_core
                text_color: 0x1ba1d1
          on_click:
            - lambda: |-
                id(current_page_index) = (id(current_page_index) - 1 + 3) % 3;
                if (id(current_page_index) == 0) {
                  lv_label_set_text(id(page_name_label), "Main");
                } else if (id(current_page_index) == 1) {
                  lv_label_set_text(id(page_name_label), "Light");
                } else {
                  lv_label_set_text(id(page_name_label), "Settings");
                }
            - lvgl.page.previous:
      
      # Footer - Seitennamen Container (mitte)
      - obj:
          x: 100
          y: 430
          width: 600
          height: 40
          bg_opa: 80%
          bg_color: 0x2a3f5f
          border_width: 1
          border_color: 0x5599dd
          border_side: INTERNAL
          radius: 20
          scrollable: false
          widgets:
            - label:
                id: page_name_label
                align: CENTER
                text_color: 0xf0f0f0
                text: "Main"
                text_font: roboto_european_core
                
      # Footer Navigation - Nächster Screen (rechts)
      - button:
          id: nav_next_button
          x: 710
          y: 430
          width: 80
          height: 40
          scrollable: false
          bg_opa: 80%
          bg_color: 0x2a3f5f
          border_width: 1
          border_color: 0x5599dd
          border_side: INTERNAL
          radius: 20
          widgets:
            - label:
                align: CENTER
                text: ">"
                text_color: 0x1ba1d1
                text_font: roboto_european_core
          on_click:
            - lambda: |-
                id(current_page_index) = (id(current_page_index) + 1) % 3;
                if (id(current_page_index) == 0) {
                  lv_label_set_text(id(page_name_label), "Main");
                } else if (id(current_page_index) == 1) {
                  lv_label_set_text(id(page_name_label), "Light");
                } else {
                  lv_label_set_text(id(page_name_label), "Settings");
                }
            - lvgl.page.next:

  # Pages
  pages:
    - !include pages/main_page.yaml
    - !include pages/light_page.yaml
    - !include pages/settings_page.yaml
