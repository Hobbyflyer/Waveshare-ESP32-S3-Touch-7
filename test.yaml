packages:
  - !include common/wifi.yaml
  - !include waveshare/waveshare-esp32-s3-touch-lcd-7-bl.yaml
  

esphome:
  name: "waveshare-test"
  friendly_name: "Display_1"  
 

globals:
  - id: current_page_index
    type: int
    initial_value: '0'

time:
  - platform: homeassistant
    id: homeassistant_time

image:
  - file: images/main_bg.png
    id: main_background
    type: RGB565
    resize: 800x480

lvgl:
  top_layer:
    widgets:
      # Header - oben links Wifi-Signal
      - label:
          id: wifi_signal_label
          align: TOP_LEFT
          x: 10
          y: 10
          text_font: montserrat_18
          text_color: grey
          text: "WiFi: --"
          scrollable: false
      
      # Footer - Navigation
      - button:  # Vorheriger Screen (links)
          id: nav_prev_button
          x: 10
          y: 420
          width: 100
          height: 40
          scrollable: false
          widgets:
            - label:
                align: CENTER
                text: "<"
                text_font: montserrat_24
          on_click:
            - lambda: |-
                id(current_page_index) = (id(current_page_index) - 1 + 3) % 3;
                if (id(current_page_index) == 0) {
                  lv_label_set_text(id(page_name_label), "Main");
                } else if (id(current_page_index) == 1) {
                  lv_label_set_text(id(page_name_label), "Light");
                } else {
                  lv_label_set_text(id(page_name_label), "Settings");
                }
            - lvgl.page.previous:
      
      - label:  # Seitenname (mitte)
          id: page_name_label
          x: 350
          y: 430
          text_font: montserrat_24
          text_color: grey
          text: "Main"
          scrollable: false
      
      - button:  # Nächster Screen (rechts)
          id: nav_next_button
          x: 690
          y: 420
          width: 100
          height: 40
          scrollable: false
          widgets:
            - label:
                align: CENTER
                text: ">"
                text_font: montserrat_24
          on_click:
            - lambda: |-
                id(current_page_index) = (id(current_page_index) + 1) % 3;
                if (id(current_page_index) == 0) {
                  lv_label_set_text(id(page_name_label), "Main");
                } else if (id(current_page_index) == 1) {
                  lv_label_set_text(id(page_name_label), "Light");
                } else {
                  lv_label_set_text(id(page_name_label), "Settings");
                }
            - lvgl.page.next:

  pages:
    # ========== MAIN PAGE ==========
    - id: main_page
      scrollable: false
      widgets:
        # Hintergrundbild
        - image:
            align: CENTER
            src: main_background
            width: 800
            height: 480
    
    # ========== LIGHT PAGE ==========
    - id: light_page
      widgets:
        # Hintergrundbild
        - image:
            align: CENTER
            src: main_background
            width: 800
            height: 480
    
    # ========== SETTINGS PAGE ==========
    - id: settings_page
      widgets:
        # Hintergrundbild
        - image:
            align: CENTER
            src: main_background
            width: 800
            height: 480

