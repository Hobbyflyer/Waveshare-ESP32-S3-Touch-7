packages:
  - !include common/wifi.yaml
  - !include waveshare/waveshare-esp32-s3-touch-lcd-7-bl.yaml
  

esphome:
  name: "waveshare-test"
  friendly_name: "Display_1"  
 

globals:
  - id: current_page_index
    type: int
    initial_value: '0'

time:
  - platform: homeassistant
    id: homeassistant_time

image:
  - file: images/main_bg.png
    id: main_background
    type: RGB565
    resize: 800x480

lvgl:
  top_layer:
    widgets:
      # Header - durchgehende Leiste
      - obj:
          x: 3
          y: 3
          width: 794
          height: 30
          scrollable: false
          bg_color: 0x2B2B2B
          border_width: 1
          border_color: 0x404040
          widgets:
            - label:
                id: wifi_signal_label
                align: LEFT_MID
                x: 10
                text_font: montserrat_16
                text_color: 0xAAAAAA
                text: "WiFi: --"
      
      # Footer - Navigation
      - button:  # Vorheriger Screen (links)
          id: nav_prev_button
          x: 3
          y: 437
          width: 119
          height: 40
          scrollable: false
          bg_color: 0x2B2B2B
          border_width: 1
          border_color: 0x404040
          radius: 5
          widgets:
            - label:
                align: CENTER
                text: "<"
                text_font: montserrat_20
          on_click:
            - lambda: |-
                id(current_page_index) = (id(current_page_index) - 1 + 3) % 3;
                if (id(current_page_index) == 0) {
                  lv_label_set_text(id(page_name_label), "Main");
                } else if (id(current_page_index) == 1) {
                  lv_label_set_text(id(page_name_label), "Light");
                } else {
                  lv_label_set_text(id(page_name_label), "Settings");
                }
            - lvgl.page.previous:
      
      - obj:  # Seitennamen-Container mit Hintergrund (mitte)
          x: 124
          y: 437
          width: 552
          height: 40
          bg_color: 0x2B2B2B
          border_width: 1
          border_color: 0x404040
          radius: 5
          scrollable: false
          widgets:
            - label:
                id: page_name_label
                align: CENTER
                text_font: montserrat_20
                text_color: 0xAAAAAA
                text: "Main"
      
      - button:  # Nächster Screen (rechts)
          id: nav_next_button
          x: 678
          y: 437
          width: 119
          height: 40
          scrollable: false
          bg_color: 0x2B2B2B
          border_width: 1
          border_color: 0x404040
          radius: 5
          widgets:
            - label:
                align: CENTER
                text: ">"
                text_font: montserrat_20
          on_click:
            - lambda: |-
                id(current_page_index) = (id(current_page_index) + 1) % 3;
                if (id(current_page_index) == 0) {
                  lv_label_set_text(id(page_name_label), "Main");
                } else if (id(current_page_index) == 1) {
                  lv_label_set_text(id(page_name_label), "Light");
                } else {
                  lv_label_set_text(id(page_name_label), "Settings");
                }
            - lvgl.page.next:

  pages:
    # ========== MAIN PAGE ==========
    - id: main_page
      scrollable: false
      widgets:
        # Hintergrundbild
        - image:
            align: CENTER
            src: main_background
            width: 800
            height: 480
    
    # ========== LIGHT PAGE ==========
    - id: light_page
      scrollable: false
      widgets:
        # Hintergrundbild
        - image:
            align: CENTER
            src: main_background
            width: 800
            height: 480
    
    # ========== SETTINGS PAGE ==========
    - id: settings_page
      scrollable: false
      widgets:
        # Hintergrundbild
        - image:
            align: CENTER
            src: main_background
            width: 800
            height: 480

