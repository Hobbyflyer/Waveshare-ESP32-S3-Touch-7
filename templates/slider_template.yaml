# common/slider_template.yaml
# Wiederverwendbares Template - definiere Variablen beim Inkludieren
substitutions:
  id_prefix: "light"
  ha_entity: "light.default"
  label_text: "Light"
  x_pos: "20"
  y_pos: "50"

binary_sensor:
  - platform: homeassistant
    id: ${id_prefix}_state
    entity_id: ${ha_entity}
    publish_initial_state: true
    on_state:
      then:
        lvgl.widget.update:
          id: ${id_prefix}_btn
          state:
            checked: !lambda return x;

sensor:
  - platform: homeassistant
    id: ${id_prefix}_sensor
    entity_id: ${ha_entity}
    attribute: brightness
    on_value:
      then:
        - lvgl.slider.update:
            id: ${id_prefix}_slider
            value: !lambda return x;

lvgl:
  # Füge Widgets zur light_page hinzu (muss bereits in test.yaml definiert sein)
  # WICHTIG: Widgets werden zur bestehenden Page hinzugefügt, nicht neu erstellt
  widgets:
        - button:
            id: ${id_prefix}_btn
            width: 100
            height: 70
            checkable: true
            widgets:
              - label:
                  align: CENTER
                  text: ${label_text}
            on_click:
              then:
                - homeassistant.action:
                    action: light.toggle
                    data:
                      entity_id: ${ha_entity}
        - slider:
            id: ${id_prefix}_slider
            x: ${x_pos}
            y: ${y_pos}
            width: 30
            height: 220
            pad_all: 8
            min_value: 0
            max_value: 255
            on_release:
              then:
                - homeassistant.action:
                    action: light.turn_on
                    data:
                      entity_id: ${ha_entity}
                      brightness: !lambda return int(x);