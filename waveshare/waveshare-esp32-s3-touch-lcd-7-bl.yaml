packages:
  waveshare_base: !include waveshare-esp32-s3-touch-lcd-7.yaml
  
defaults:
  backlight_brightness_pin: "GPIO16"
  initial_brightness: "0.7"   # 0.7 entspricht ca. 179/255
  min_power: "0.00"

output:
  - platform: ledc
    pin: ${backlight_brightness_pin}
    id: backlight_brightness_output
    min_power: ${min_power}
    zero_means_zero: true

light:
  - id: !extend lcdbacklight
    internal: true
    name: !remove
  - platform: monochromatic
    output: backlight_brightness_output
    id: lcdbacklight_brightness
    name: LCD Backlight
    icon: mdi:wall-sconce-flat-outline
    # disabled_by_default: true  # Entfernt, damit das Backlight in HA verfügbar ist
    restore_mode: ALWAYS_ON
    initial_state:
      state: ON
      brightness: ${initial_brightness}