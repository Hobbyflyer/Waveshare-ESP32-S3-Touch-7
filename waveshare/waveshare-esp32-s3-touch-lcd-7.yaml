esphome:
  min_version: "2025.8.0"
  platformio_options:
    board_upload.maximum_ram_size: 524288

# Wichtig für dieses Board: USB-Seriell Verbindung
uart:
  - id: uart_bus
    tx_pin: GPIO43
    rx_pin: GPIO44
    baud_rate: 115200

psram:
  mode: octal
  speed: 120MHz

esp32:
  #board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB  # Auf 16MB korrigiert für deine Hardware
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true
    sdkconfig_options:
      # Speicher-Größe synchronisiert
      CONFIG_ESPTOOLPY_FLASHSIZE_16MB: "y"
      
      # Stabile Boot-Parameter (DIO + 80MHz verhindern Reboots)
      CONFIG_ESPTOOLPY_FLASHMODE_DIO: y 
      CONFIG_ESPTOOLPY_FLASHFREQ_80M: y
      
      # PSRAM Konfiguration (Octal ist wichtig für 8MB PSRAM)
      CONFIG_SPIRAM_MODE_OCT: y
      CONFIG_SPIRAM_SPEED_80M: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
      
      # System-Taktung
      CONFIG_FREERTOS_HZ: "1000"
      CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_240: y
      
      # Performance-Optimierung (Sicherer als Cache-Tweaks)
      CONFIG_COMPILER_OPTIMIZATION_PERF: y
      CONFIG_IDF_EXPERIMENTAL_FEATURES: y      

i2c:
  sda: GPIO08
  scl: GPIO09
  scan: True
  id: bus_a

ch422g:
  - id: ch422g_hub

output:
  - platform: gpio
    id: lcdbacklight_output
    pin:
      ch422g: ch422g_hub
      number: 2
      mode:
        output: true
      inverted: false
  
light:
  - platform: binary
    output: lcdbacklight_output
    id: lcdbacklight
    name: LCD Backlight
    icon: mdi:wall-sconce-flat-outline
    disabled_by_default: true
    restore_mode: ALWAYS_ON
    on_turn_off:
      - script.execute: start_antiburn
    on_turn_on:
      - script.execute: stop_antiburn

script:
  - id: start_antiburn
    then:
      - delay: 30s  # Reduziert von 5min auf 30s zum Testen
      - logger.log: Starting automatic antiburn.
      - switch.turn_on: switch_antiburn
  - id: stop_antiburn
    then:
      - script.stop: start_antiburn
      - switch.turn_off: switch_antiburn

switch:
  - platform: template
    name: Antiburn
    id: switch_antiburn
    icon: mdi:television-shimmer
    optimistic: true
    entity_category: "config"
    # disabled_by_default: true  # Entfernt, damit der Switch in HA verfügbar ist
    turn_on_action:
      - logger.log: "Starting Antiburn"
      - light.turn_on:  # Backlight auf 1% Helligkeit setzen für minimalen Stromverbrauch
          id: lcdbacklight_brightness
          brightness: 0.01
    turn_off_action:
      - logger.log: "Stopping Antiburn"
      - light.turn_on:  # Backlight auf normale Helligkeit zurücksetzen
          id: lcdbacklight_brightness
          brightness: 0.8

lvgl:

### Display
display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-7-800X480
    id: waveshare_display
    update_interval: never
    auto_clear_enabled: false
    color_order: RGB
    pclk_frequency: 16MHZ
    dimensions:
      width: 800
      height: 480
    de_pin:
      number: 5
    hsync_pin:
      number: 46
      ignore_strapping_warning: true
    vsync_pin:
      number: 3
      ignore_strapping_warning: true
    pclk_pin: 7
    pclk_inverted: true
    reset_pin:
      ch422g: ch422g_hub
      number: 3
    hsync_back_porch: 8
    hsync_front_porch: 8
    hsync_pulse_width: 4
    vsync_back_porch: 16
    vsync_front_porch: 16
    vsync_pulse_width: 4
    data_pins:
      red:
        - 1         #r3
        - 2         #r4
        - 42        #r5
        - 41        #r6
        - 40        #r7
      blue:
        - 14        #b3
        - 38        #b4
        - 18        #b5
        - 17        #b6
        - 10        #b7
      green:
        - 39        #g2
        - 0         #g3
        - 45        #g4
        - 48        #g5
        - 47        #g6
        - 21        #g7

### Touchscreen
touchscreen:
  platform: gt911
  id: waveshare_touch
  interrupt_pin: GPIO4
  reset_pin:
    ch422g: ch422g_hub
    number: 1
    mode: OUTPUT

